name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint / Test / Build / Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against "~" artifact resurrection
        run: |
          test -z "$(git ls-files -- '~')"
          git check-ignore -q '~'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm run test

      - name: Refresh climate snapshot (best-effort)
        # The script keeps the last-good committed snapshot on transient
        # Open-Meteo failures and always exits 0; never fail CI on weather.
        run: npm run climate:snapshot

      - name: Build
        run: npm run build

      - name: Built-HTML critical-CSS dedupe guard
        # dist/index.html must carry exactly one inline <style> (the full
        # built CSS bundle) and none of the dev-only static critical block;
        # a regression here would re-introduce duplicate mirror rules.
        run: |
          test -f dist/index.html
          ! grep -q 'data-critical-mirror' dist/index.html
          test "$(grep -o '<style' dist/index.html | wc -l)" -eq 1

      - name: Size budget
        run: npm run size
